<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>婚禮規劃 Web App</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Vue 3 -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            pinky: '#F6C1D1',
            minty: '#C9EDE0',
            lavender: '#E6D9F7',
            groom: '#BFD9FF',
            bride: '#F6C1D1',
            other: '#C9EDE0'
          },
          boxShadow: {
            soft: '0 10px 25px rgba(0,0,0,0.08)'
          }
        }
      }
    }
  </script>
</head>

<body class="bg-gradient-to-br from-pinky via-lavender to-minty min-h-screen flex justify-center items-center">

<div id="app" class="relative w-full max-w-md h-[90vh] bg-white/80 backdrop-blur rounded-3xl shadow-soft overflow-hidden flex flex-col">

  <!-- Header -->
  <div class="p-4 text-center font-semibold text-lg shrink-0">💍 婚禮規劃</div>

  <!-- Main Content -->
  <div class="flex-1 overflow-y-auto p-4 space-y-4">

    <!-- 🪙 金器分頁 -->
    <div v-if="currentTab==='gold'" class="space-y-3">

      <h2 class="font-semibold">🪙 金器記錄</h2>

      <!-- 金器列表 -->
      <div class="space-y-2">
        <div v-for="(item,idx) in goldList" :key="item.id" class="bg-white rounded-2xl p-3 shadow-soft flex gap-3">

          <!-- 編號 -->
          <div class="text-xs text-gray-400">#{{ idx + 1 }}</div>

          <!-- 圖片 -->
          <img v-if="item.image" :src="item.image" class="w-16 h-16 rounded-xl object-cover" />
          <div v-else class="w-16 h-16 rounded-xl bg-gray-100 flex items-center justify-center text-xs text-gray-400">無圖</div>

          <!-- 資訊 -->
          <div class="flex-1">
            <div class="text-sm font-medium">{{ item.category }} × {{ item.qty }}</div>
            <div class="text-xs text-gray-500">{{ item.from }}</div>
            <div class="inline-block mt-1 px-2 py-0.5 rounded-full text-xs"
              :class="item.side==='男家'?'bg-groom':'bg-bride'">
              {{ item.side }}
            </div>
          </div>

        </div>
      </div>

    </div>

  </div>

  <!-- Floating Add Button -->
  <button v-if="currentTab==='gold'" @click="showAddGold=true"
    class="absolute bottom-20 right-4 w-14 h-14 rounded-full bg-pinky/80 text-white text-3xl shadow-soft flex items-center justify-center">＋</button>

  <!-- 新增金器 Modal -->
  <div v-if="showAddGold" class="absolute inset-0 bg-black/30 flex items-center justify-center">
    <div class="bg-white rounded-2xl p-4 w-11/12 space-y-3 shadow-soft">

      <h3 class="font-semibold">新增金器</h3>

      <!-- 金器類別 -->
      <div class="flex flex-wrap gap-2">
        <button v-for="c in goldCategories" :key="c"
          @click="newGold.category=c"
          :class="['px-3 py-1 rounded-full text-xs', newGold.category===c?'bg-pinky':'bg-gray-100']">
          {{ c }}
        </button>
      </div>

      <!-- 數量 -->
      <input v-model.number="newGold.qty" type="number" inputmode="numeric" placeholder="數量"
        class="w-full border rounded-lg p-2 text-sm" />

      <!-- 男 / 女家 -->
      <div class="flex gap-2">
        <button @click="newGold.side='男家'" :class="['flex-1 p-2 rounded-xl text-sm', newGold.side==='男家'?'bg-groom':'bg-gray-100']">男家</button>
        <button @click="newGold.side='女家'" :class="['flex-1 p-2 rounded-xl text-sm', newGold.side==='女家'?'bg-bride':'bg-gray-100']">女家</button>
      </div>

      <!-- 送禮人 -->
      <input v-model="newGold.from" placeholder="送禮人 / 身份" class="w-full border rounded-lg p-2 text-sm" />

      <!-- 圖片 -->
      <input type="file" accept="image/*" @change="handleImage" class="text-sm" />

      <div class="flex justify-end gap-3">
        <button @click="showAddGold=false" class="text-sm text-gray-400">取消</button>
        <button @click="addGold" class="text-sm text-green-500">新增</button>
      </div>

    </div>
  </div>

  <!-- Bottom Navigation -->
  <div class="shrink-0 grid grid-cols-5 text-center border-t bg-white text-xs">
    <button class="p-3">⛪ 行程</button>
    <button class="p-3" :class="currentTab==='gold'?'text-pink-500 font-semibold':''" @click="currentTab='gold'">🪙 金器</button>
    <button class="p-3">🧧 禮物</button>
    <button class="p-3">📝 資訊</button>
    <button class="p-3" @click="currentTab='contact'">📞 聯絡</button>
  </div>

</div>

<script>
const { createApp } = Vue

createApp({
  data(){
    return {
      currentTab:'contact',
      goldCategories:['耳環','頸鍊','吊墜','手扼','手鍊','戒指','擺件'],
      goldList: JSON.parse(localStorage.getItem('goldList')||'[]'),
      showAddGold:false,
      newGold:{ category:'', qty:1, side:'男家', from:'', image:'' }
    }
  },
  watch:{
    goldList:{ deep:true, handler(v){ localStorage.setItem('goldList',JSON.stringify(v)) } }
  },
  methods:{
    addGold(){
      if(!this.newGold.category || !this.newGold.qty) return
      this.goldList.push({
        id: Date.now(),
        ...this.newGold
      })
      this.newGold={ category:'', qty:1, side:'男家', from:'', image:'' }
      this.showAddGold=false
    },
    handleImage(e){
      const file = e.target.files[0]
      if(!file) return
      const reader = new FileReader()
      reader.onload = ()=>{ this.newGold.image = reader.result }
      reader.readAsDataURL(file)
    }
  }
}).mount('#app')
</script>

</body>
</html>
