<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>婚禮規劃 App</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/vue@3.4.38/dist/vue.global.prod.js"></script>

<style>
[v-cloak]{display:none}
</style>
</head>

<body class="min-h-screen bg-gradient-to-br from-pink-200 via-rose-100 to-purple-200 flex items-center justify-center">

<div id="app" v-cloak
 class="relative w-full max-w-md h-[92vh] bg-white/80 backdrop-blur rounded-3xl shadow-xl flex flex-col overflow-hidden">

  <!-- Header -->
  <div class="p-4 text-center font-semibold text-lg text-gray-700">
    {{ pageTitle }}
  </div>

  <!-- Pages -->
  <div class="flex-1 overflow-y-auto p-4 pb-24">

    <!-- 行程 -->
    <div v-if="tab==='schedule'" class="text-center text-gray-400 mt-10">
      當日行程（稍後補充）
    </div>

    <!-- 金器 -->
    <div v-if="tab==='gold'" class="space-y-3 relative">

      <div v-for="g in golds" :key="g.id"
        :class="[
          'rounded-xl p-3 shadow transition',
          g.deleted ? 'bg-gray-100 text-gray-400 line-through' : 'bg-white'
        ]">

        <div class="text-sm font-medium">
          #{{ g.no }} {{ g.category }} × {{ g.qty }}
        </div>

        <div class="text-xs"
          :class="g.deleted
            ? 'text-gray-400'
            : (g.side==='男家' ? 'text-blue-500' : 'text-pink-500')">
          {{ g.side }}
        </div>

        <div class="text-xs text-gray-500">{{ g.from }}</div>

        <img v-if="g.image" :src="g.image"
          class="mt-2 w-full rounded-lg opacity-80" />

        <div v-if="!g.deleted" class="flex gap-3 text-xs mt-2">
          <button @click="openEditGold(g)" class="text-blue-500">編輯</button>
          <button @click="deleteGold(g.id)" class="text-red-400">刪除</button>
        </div>

        <div v-else class="flex items-center justify-between text-xs mt-2 italic">
  <span>（已刪除）</span>
  <button
    @click="restoreGold(g.id)"
    class="text-blue-400 not-italic">
    復原
  </button>
</div>


      </div>

      <button @click="openAddGold"
        class="absolute bottom-4 right-4 w-14 h-14 rounded-full bg-pink-400 text-white text-3xl shadow-lg">
        +
      </button>
    </div>

    <!-- 利是 / 禮物（佔位） -->
    <div v-if="tab==='gift'" class="text-center text-gray-400 mt-10">
      利是 / 禮物（下一步補）
    </div>

    <!-- 資訊 -->
    <div v-if="tab==='info'" class="text-center text-gray-400 mt-10">
      物資清單 / 影相次序 / 晚宴座位表（佔位）
    </div>

    <!-- 聯絡（佔位） -->
    <div v-if="tab==='contact'" class="text-center text-gray-400 mt-10">
      聯絡人（下一步補）
    </div>

  </div>

  <!-- Bottom Nav -->
  <div class="h-16 border-t bg-white flex justify-around items-center text-xs">
    <button @click="tab='schedule'">⛪<br>行程</button>
    <button @click="tab='gold'">🪙<br>金器</button>
    <button @click="tab='gift'">🧧<br>利是</button>
    <button @click="tab='info'">📝<br>資訊</button>
    <button @click="tab='contact'">📞<br>聯絡</button>
  </div>

  <!-- 金器 Modal -->
  <div v-if="showGoldModal"
    class="fixed inset-0 bg-black/30 flex items-center justify-center z-50">

    <div class="bg-white rounded-3xl p-5 w-11/12 max-w-sm space-y-4 shadow-xl">

      <h3 class="text-center font-semibold text-lg text-gray-700">
        {{ currentGold.id ? '編輯金器' : '新增金器' }}
      </h3>

      <!-- 金器類別 -->
      <div>
        <div class="text-sm text-gray-500 mb-2">金器類別</div>
        <div class="flex flex-wrap gap-2">
          <button v-for="c in goldCategories" :key="c"
            @click="currentGold.category=c"
            :class="[
              'px-3 py-1 rounded-full text-sm transition',
              currentGold.category===c
                ? 'bg-amber-300 text-gray-800 shadow'
                : 'bg-gray-200 text-gray-500'
            ]">
            {{ c }}
          </button>
        </div>
      </div>

      <!-- 數量 -->
      <div>
        <div class="text-sm text-gray-500 mb-1">數量</div>
        <input type="number" min="1" inputmode="numeric"
          v-model.number="currentGold.qty"
          class="w-full border rounded-xl p-2 text-sm" />
      </div>

      <!-- 男 / 女家 -->
      <div>
        <div class="text-sm text-gray-500 mb-1">男 / 女家</div>
        <div class="flex gap-2">
          <button @click="currentGold.side='男家'"
            :class="['flex-1 py-2 rounded-xl text-sm',
              currentGold.side==='男家'
                ? 'bg-blue-400 text-white'
                : 'bg-gray-200 text-gray-500']">
            男家
          </button>
          <button @click="currentGold.side='女家'"
            :class="['flex-1 py-2 rounded-xl text-sm',
              currentGold.side==='女家'
                ? 'bg-pink-400 text-white'
                : 'bg-gray-200 text-gray-500']">
            女家
          </button>
        </div>
      </div>

      <!-- 送禮人 -->
      <div>
        <div class="text-sm text-gray-500 mb-1">送禮人</div>
        <input v-model="currentGold.from"
          class="w-full border rounded-xl p-2 text-sm" />
      </div>

      <!-- 圖片 -->
      <div>
        <div class="text-sm text-gray-500 mb-1">圖片</div>
        <input type="file" accept="image/*" @change="loadGoldImage" />
        <img v-if="currentGold.image" :src="currentGold.image"
          class="mt-2 w-full rounded-xl" />
      </div>

      <!-- Buttons -->
      <div class="flex justify-end gap-4 pt-2">
        <button @click="closeGoldModal"
          class="text-sm text-gray-400">
          取消
        </button>
        <button @click="saveGold"
          class="text-sm text-amber-500 font-medium">
          儲存
        </button>
      </div>

    </div>
  </div>

</div>

<script>
const { createApp } = Vue

createApp({
  data(){
    return{
      tab:'schedule',
      golds: JSON.parse(localStorage.getItem('goldList')||'[]'),
      goldCategories:['耳環','頸鍊','吊墜','手扼','手鍊','戒指','擺件'],
      showGoldModal:false,
      currentGold:{}
    }
  },
  computed:{
    pageTitle(){
      return this.tab==='schedule'?'⛪ 行程':
             this.tab==='gold'?'🪙 金器':
             this.tab==='gift'?'🧧 利是 / 禮物':
             this.tab==='info'?'📝 資訊':'📞 聯絡'
    }
  },
  methods:{
    openAddGold(){
      this.currentGold={
        category:'',
        qty:1,
        side:'',
        from:'',
        image:'',
        deleted:false
      }
      this.showGoldModal=true
    },
    openEditGold(g){
      this.currentGold={...g}
      this.showGoldModal=true
    },
    closeGoldModal(){
      this.showGoldModal=false
      this.currentGold={}
    },
    saveGold(){
      if(!this.currentGold.id){
        this.currentGold.id=Date.now()
        this.currentGold.no=this.golds.length+1
        this.golds.push(this.currentGold)
      }else{
        const i=this.golds.findIndex(x=>x.id===this.currentGold.id)
        this.golds[i]=this.currentGold
      }
      localStorage.setItem('goldList',JSON.stringify(this.golds))
      this.closeGoldModal()
    },
    deleteGold(id){
      const g=this.golds.find(x=>x.id===id)
      if(g){
        g.deleted=true
        localStorage.setItem('goldList',JSON.stringify(this.golds))
      }
    },
    loadGoldImage(e){
      const file=e.target.files[0]
      if(!file) return
      const reader=new FileReader()
      reader.onload=()=>{ this.currentGold.image=reader.result }
      reader.readAsDataURL(file)
    },
    restoreGold(id){
     const g = this.golds.find(x => x.id === id)
     if(g){
      g.deleted = false
      localStorage.setItem('goldList', JSON.stringify(this.golds))
     }
    }
  }
}).mount('#app')
</script>

</body>
</html>
