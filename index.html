<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>婚禮規劃 Web App</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Vue 3 -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            pinky: '#F6C1D1',
            minty: '#C9EDE0',
            lavender: '#E6D9F7'
          },
          boxShadow: {
            soft: '0 10px 25px rgba(0,0,0,0.08)'
          }
        }
      }
    }
  </script>
</head>

<body class="bg-gradient-to-br from-pinky via-lavender to-minty min-h-screen flex justify-center items-center">

<div id="app" class="w-full max-w-md h-[90vh] bg-white/80 backdrop-blur rounded-3xl shadow-soft overflow-hidden flex flex-col">

  <!-- Header -->
  <div class="p-4 text-center font-semibold text-lg shrink-0">💍 婚禮規劃</div>

  <!-- Main Content -->
  <div class="flex-1 overflow-y-auto p-4 space-y-4">

    <!-- 行程 -->
    <div v-if="currentTab==='schedule'" class="space-y-3">
      <h2 class="font-semibold">⛪ 婚禮當天行程</h2>
      <div v-for="(item,idx) in schedule" :key="idx" class="bg-white rounded-2xl p-3 shadow-soft flex justify-between">
        <div>
          <div class="text-sm font-medium">{{ item.time }}</div>
          <div class="text-xs text-gray-500">{{ item.title }}</div>
        </div>
        <button @click="schedule.splice(idx,1)" class="text-xs text-red-400">刪除</button>
      </div>
    </div>

    <!-- 金器 -->
    <div v-if="currentTab==='gold'" class="space-y-3">
      <h2 class="font-semibold">🪙 金器</h2>
      <div class="bg-white rounded-2xl p-3 shadow-soft text-sm text-gray-500">
        （功能稍後加入）
      </div>
    </div>

    <!-- 利是 / 禮物 -->
    <div v-if="currentTab==='red'" class="space-y-3">
      <h2 class="font-semibold">🧧 利是 / 禮物</h2>
      <div class="bg-white rounded-2xl p-3 shadow-soft text-sm text-gray-500">
        （功能稍後加入）
      </div>
    </div>

    <!-- 資訊 -->
    <div v-if="currentTab==='info'" class="space-y-3">
      <h2 class="font-semibold">📝 資訊</h2>
      <div class="bg-white rounded-2xl p-3 shadow-soft text-sm text-gray-500">
        物資 List / 影相次序 / 晚宴座位表（稍後加入）
      </div>
    </div>

    <!-- 聯絡 -->
    <div v-if="currentTab==='contacts'" class="space-y-3">
      <div class="flex gap-2">
        <button v-for="g in contactGroups" :key="g"
          @click="activeContactGroup=g"
          :class="['flex-1 p-2 rounded-xl text-sm', activeContactGroup===g?'bg-pinky':'bg-gray-100']">
          {{ g }}
        </button>
      </div>

      <div class="bg-white rounded-2xl p-3 shadow-soft space-y-2">
        <div v-for="(c,idx) in contacts[activeContactGroup]" :key="idx" class="flex justify-between text-sm">
          <div>
            <div class="font-medium">{{ c.name }}</div>
            <div class="text-xs text-gray-500">{{ c.role }}｜{{ c.phone }}</div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- Bottom Navigation -->
  <div class="shrink-0 grid grid-cols-5 text-center border-t bg-white text-xs">
    <button @click="currentTab='schedule'" :class="['p-3', currentTab==='schedule'?'text-pink-500 font-semibold':'']">⛪ 行程</button>
    <button @click="currentTab='gold'" :class="['p-3', currentTab==='gold'?'text-pink-500 font-semibold':'']">🪙 金器</button>
    <button @click="currentTab='red'" :class="['p-3', currentTab==='red'?'text-pink-500 font-semibold':'']">🧧 禮物</button>
    <button @click="currentTab='info'" :class="['p-3', currentTab==='info'?'text-pink-500 font-semibold':'']">📝 資訊</button>
    <button @click="currentTab='contacts'" :class="['p-3', currentTab==='contacts'?'text-pink-500 font-semibold':'']">📞 聯絡</button>
  </div>

</div>

<script>
const { createApp } = Vue

createApp({
  data(){
    return {
      currentTab:'schedule',
      schedule: JSON.parse(localStorage.getItem('schedule')||'[]'),
      contactGroups:['新郎','新娘','其他'],
      activeContactGroup:'新郎',
      contacts: JSON.parse(localStorage.getItem('contacts')||'{"新郎":[],"新娘":[],"其他":[]}')
    }
  }
}).mount('#app')
</script>

</body>
</html>
