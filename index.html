  <div class="flex flex-wrap gap-2">
    <button v-for="cat in goldCategories" :key="cat"
      @click="newGold.category = cat"

<script>
const { createApp } = Vue

createApp({
  data() {
    return {
      goldCategories: ['耳環','頸鍊','吊墜','手扼','手鍊','戒指','擺件'],
      goldList: JSON.parse(localStorage.getItem('goldList') || '[]'),
      showAddGold: false,
      showEditGold: false,
      search: '',
      sortBy: 'time',
      newGold: { category:'', qty:1, side:'男家', from:'', image:'' },
      editGold: { id:null, category:'', qty:1, side:'男家', from:'', image:'' }
    }
  },
  computed: {
    filteredList() {
      let list = [...this.goldList]

      if (this.search) {
        const s = this.search.toLowerCase()
        list = list.filter(i =>
          i.from.toLowerCase().includes(s) || i.category.includes(s)
        )
      }

      if (this.sortBy === 'side') {
        list.sort((a,b) => a.side.localeCompare(b.side))
      } else if (this.sortBy === 'category') {
        list.sort((a,b) => a.category.localeCompare(b.category))
      } else {
        list.sort((a,b) => a.id - b.id)
      }

      return list
    }
  },
  methods: {
    sortBtn(type) {
      return [
        'flex-1 rounded-xl text-xs py-1',
        this.sortBy === type ? 'bg-pink-400 text-white' : 'bg-white'
      ]
    },
    countSide(side) {
      return this.filteredList.filter(i => i.side === side).length
    },
    handleAddImage(e) {
      const file = e.target.files[0]
      if (!file) return
      const reader = new FileReader()
      reader.onload = () => this.newGold.image = reader.result
      reader.readAsDataURL(file)
    },
    handleEditImage(e) {
      const file = e.target.files[0]
      if (!file) return
      const reader = new FileReader()
      reader.onload = () => this.editGold.image = reader.result
      reader.readAsDataURL(file)
    },
    addGold() {
      if (!this.newGold.category) return
      this.goldList.push({ ...this.newGold, id: Date.now() })
      this.save()
      this.showAddGold = false
      this.newGold = { category:'', qty:1, side:'男家', from:'', image:'' }
    },
    openEdit(item) {
      this.editGold = { ...item }
      this.showEditGold = true
    },
    saveEditGold() {
      const i = this.goldList.findIndex(g => g.id === this.editGold.id)
      if (i !== -1) this.goldList[i] = { ...this.editGold }
      this.save()
      this.showEditGold = false
    },
    removeGold(id) {
      if (!confirm('確定刪除？')) return
      this.goldList = this.goldList.filter(g => g.id !== id)
      this.save()
    },
    save() {
      localStorage.setItem('goldList', JSON.stringify(this.goldList))
    }
  }
}).mount('#app')
</script>

</body>
</html>
