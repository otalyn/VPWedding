<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>婚禮規劃 Web App</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Vue 3 -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            pinky: '#F6C1D1',
            minty: '#C9EDE0',
            skysoft: '#CFE8F7',
            lavender: '#E6D9F7'
          },
          boxShadow: {
            soft: '0 10px 30px rgba(0,0,0,0.08)'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gradient-to-br from-pinky via-lavender to-minty min-h-screen flex justify-center items-center">

<div id="app" class="w-full max-w-md h-[90vh] bg-white/80 backdrop-blur rounded-3xl shadow-soft overflow-hidden flex flex-col">

  <!-- Header -->
  <div class="p-4 text-center font-semibold text-lg">💍 婚禮規劃</div>

  <!-- Content -->
  <div class="flex-1 overflow-y-auto p-4 space-y-4">

    <!-- 行程表 -->
    <div v-if="currentTab==='schedule'" class="space-y-3">
      <h2 class="font-semibold">⛪ 婚禮當天行程</h2>

      <div v-for="(item,idx) in schedule" class="bg-white rounded-2xl p-3 shadow-soft flex justify-between items-center">
        <div>
          <div class="text-sm font-medium">{{ item.time }}</div>
          <div class="text-xs text-gray-500">{{ item.title }}</div>
        </div>
        <button @click="removeItem('schedule',idx)" class="text-xs text-red-400">刪除</button>
      </div>

      <div class="bg-white rounded-2xl p-3 shadow-soft space-y-2">
        <input v-model="newSchedule.time" placeholder="時間" class="w-full border rounded-xl p-2 text-sm" />
        <input v-model="newSchedule.title" placeholder="事項" class="w-full border rounded-xl p-2 text-sm" />
        <button @click="addSchedule" class="w-full bg-pinky rounded-xl p-2 text-sm">新增</button>
      </div>
    </div>

    <!-- 收禮 -->
    <div v-if="currentTab==='gifts'" class="space-y-3">
      <div class="flex gap-2">
        <button @click="giftType='gold'" :class="giftType==='gold'?'bg-pinky':'bg-gray-100'" class="flex-1 p-2 rounded-xl">🪙 金器</button>
        <button @click="giftType='red'" :class="giftType==='red'?'bg-pinky':'bg-gray-100'" class="flex-1 p-2 rounded-xl">🧧 利是/禮物</button>
      </div>

      <div v-for="(g,idx) in gifts[giftType]" class="bg-white rounded-2xl p-3 shadow-soft flex justify-between text-sm">
        {{ g }}
        <button @click="removeGift(idx)" class="text-red-400 text-xs">刪除</button>
      </div>

      <div class="bg-white rounded-2xl p-3 shadow-soft flex gap-2">
        <input v-model="newGift" placeholder="內容" class="flex-1 border rounded-xl p-2 text-sm" />
        <button @click="addGift" class="bg-pinky rounded-xl px-4">＋</button>
      </div>
    </div>

    <!-- 資訊 -->
    <div v-if="currentTab==='info'" class="space-y-3">
      <div class="flex gap-1 text-xs">
        <button v-for="i in infoTabs" @click="infoTab=i" :class="['flex-1 p-2 rounded-xl', infoTab===i?'bg-minty':'bg-gray-100']">{{ i }}</button>
      </div>

      <div v-for="(x,idx) in info[infoTab]" class="bg-white rounded-2xl p-3 shadow-soft flex justify-between text-sm">
        {{ x }}
        <button @click="removeInfo(idx)" class="text-red-400 text-xs">刪除</button>
      </div>

      <div class="bg-white rounded-2xl p-3 shadow-soft flex gap-2">
        <input v-model="newInfo" placeholder="新增內容" class="flex-1 border rounded-xl p-2 text-sm" />
        <button @click="addInfo" class="bg-minty rounded-xl px-4">＋</button>
      </div>
    </div>

    <!-- 聯絡 -->
    <div v-if="currentTab==='contacts'" class="space-y-3">

      <!-- 分類選擇 -->
      <div class="flex gap-2 text-xs">
        <button v-for="g in contactGroups" :key="g"
          @click="activeContactGroup=g"
          :class="['flex-1 p-2 rounded-xl', activeContactGroup===g?'bg-pinky':'bg-gray-100']">
          {{ g }}
        </button>
      </div>

      <!-- 聯絡列表 -->
      <div class="bg-white rounded-2xl p-3 shadow-soft space-y-2">
        <div v-if="contacts[activeContactGroup].length===0" class="text-xs text-gray-400 text-center">尚未新增聯絡人</div>

        <div v-for="(c,idx) in contacts[activeContactGroup]" class="flex justify-between items-center text-sm">
          <div>
            <div class="font-medium">{{ c.name }}</div>
            <div class="text-xs text-gray-500">{{ c.role }}｜{{ c.phone }}</div>
          </div>
          <button @click="removeContact(activeContactGroup,idx)" class="text-red-400 text-xs">刪除</button>
        </div>
      </div>

      <!-- 新增聯絡人 -->
      <div class="bg-white rounded-2xl p-3 shadow-soft space-y-2">
        <input v-model="newContact.name" placeholder="姓名" class="w-full border rounded-xl p-2 text-sm" />
        <input v-model="newContact.role" placeholder="身份 / 角色" class="w-full border rounded-xl p-2 text-sm" />
        <input v-model="newContact.phone" placeholder="電話" class="w-full border rounded-xl p-2 text-sm" />
        <button @click="addContact" class="w-full bg-minty rounded-xl p-2 text-sm">新增聯絡人</button>
      </div>

    </div>

  </div>

  <!-- Bottom Nav -->
  <div class="grid grid-cols-4 text-xs text-center border-t bg-white">
    <button v-for="t in tabs" @click="currentTab=t.key" :class="['p-2', currentTab===t.key?'text-pink-500 font-semibold':'']">{{ t.label }}</button>
  </div>

</div>

<script>
const { createApp } = Vue
createApp({
  data(){
    return {
      currentTab:'schedule',
      giftType:'gold',
      infoTab:'物資List',
      tabs:[
        {key:'schedule',label:'⛪ 行程'},
        {key:'gifts',label:'🧧 收禮'},
        {key:'info',label:'📝 資訊'},
        {key:'contacts',label:'📞 聯絡'}
      ],
      schedule: JSON.parse(localStorage.getItem('schedule')||'[]'),
      gifts: JSON.parse(localStorage.getItem('gifts')||'{"gold":[],"red":[]}'),
      infoTabs:['物資List','影相次序','晚宴座位表'],
      info: JSON.parse(localStorage.getItem('info')||'{"物資List":[],"影相次序":[],"晚宴座位表":[]}'),
      contactGroups:['新郎','新娘','其他'],
      activeContactGroup:'新郎',
      contacts: JSON.parse(localStorage.getItem('contacts')||'{"新郎":[],"新娘":[],"其他":[]}'),
      newContact:{ name:'', role:'', phone:'' },
      newSchedule:{time:'',title:''},
      newGift:'',
      newInfo:''
    }
  },
  watch:{
    schedule:{handler(v){localStorage.setItem('schedule',JSON.stringify(v))},deep:true},
    gifts:{handler(v){localStorage.setItem('gifts',JSON.stringify(v))},deep:true},
    info:{handler(v){localStorage.setItem('info',JSON.stringify(v))},deep:true},
    contacts:{handler(v){localStorage.setItem('contacts',JSON.stringify(v))},deep:true}
  },
  methods:{
    addSchedule(){ if(this.newSchedule.time&&this.newSchedule.title){ this.schedule.push({...this.newSchedule}); this.newSchedule={time:'',title:''} } },
    addGift(){ if(this.newGift){ this.gifts[this.giftType].push(this.newGift); this.newGift='' } },
    addInfo(){ if(this.newInfo){ this.info[this.infoTab].push(this.newInfo); this.newInfo='' } },
    addContact(){
      const { name, role, phone } = this.newContact
      if(name && phone){
        this.contacts[this.activeContactGroup].push({ name, role, phone })
        this.newContact = { name:'', role:'', phone:'' }
      }
    },
    removeItem(k,i){ this[k].splice(i,1) },
    removeGift(i){ this.gifts[this.giftType].splice(i,1) },
    removeInfo(i){ this.info[this.infoTab].splice(i,1) },
    removeContact(g,i){ this.contacts[g].splice(i,1) }
  }
  }
}).mount('#app')
</script>

</body>
</html>
