<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>婚禮規劃 Web App</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Vue 3 -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            pinky: '#F6C1D1',
            minty: '#C9EDE0',
            lavender: '#E6D9F7',
            groom: '#BFD9FF',
            bride: '#F6C1D1',
            other: '#C9EDE0'
          },
          boxShadow: {
            soft: '0 10px 25px rgba(0,0,0,0.08)'
          }
        }
      }
    }
  </script>
</head>

<body class="bg-gradient-to-br from-pinky via-lavender to-minty min-h-screen flex justify-center items-center">

<div id="app" class="relative w-full max-w-md h-[90vh] bg-white/80 backdrop-blur rounded-3xl shadow-soft overflow-hidden flex flex-col">

  <!-- Header -->
  <div class="p-4 text-center font-semibold text-lg shrink-0">💍 婚禮規劃</div>

  <!-- Main Content -->
  <div class="flex-1 overflow-y-auto p-4 space-y-4">

    <!-- 聯絡 -->
    <div v-if="currentTab==='contacts'" class="space-y-3">

      <!-- 搜尋 -->
      <input v-model="search" placeholder="搜尋聯絡人" class="w-full border rounded-xl p-2 text-sm" />

      <!-- 分類 -->
      <div class="flex gap-2">
        <button v-for="g in contactGroups" :key="g"
          @click="activeContactGroup=g; cancelEdit()"
          :class="['flex-1 p-2 rounded-xl text-sm font-medium', groupBtnClass(g)]">
          {{ g }}
        </button>
      </div>

      <!-- 聯絡列表 -->
      <div class="bg-white rounded-2xl p-3 shadow-soft space-y-2">
        <div v-if="filteredContacts.length===0" class="text-xs text-gray-400 text-center">沒有符合的聯絡人</div>

        <div v-for="(c,idx) in filteredContacts" :key="idx" class="space-y-1">

          <!-- 查看模式 -->
          <div v-if="editIndex!==idx" class="flex justify-between items-center text-sm">
            <div>
              <div class="font-medium">{{ c.name }}</div>
              <div class="text-xs text-gray-500">{{ c.role }}</div>
              <a :href="'tel:'+c.phone" class="text-xs text-blue-500 underline">📞 {{ c.phone }}</a>
            </div>
            <div class="flex gap-2">
              <button @click="startEdit(c,idx)" class="text-xs text-blue-400">編輯</button>
              <button @click="removeContact(activeContactGroup,idx)" class="text-xs text-red-400">刪除</button>
            </div>
          </div>

          <!-- 編輯模式 -->
          <div v-else class="bg-gray-50 rounded-xl p-2 space-y-1">
            <input v-model="editContact.name" class="w-full border rounded-lg p-1 text-sm" />
            <input v-model="editContact.role" class="w-full border rounded-lg p-1 text-sm" />
            <input v-model="editContact.phone" class="w-full border rounded-lg p-1 text-sm" />
            <div class="flex justify-end gap-2">
              <button @click="cancelEdit" class="text-xs text-gray-400">取消</button>
              <button @click="saveEdit(idx)" class="text-xs text-green-500">儲存</button>
            </div>
          </div>

        </div>
      </div>

    </div>

  </div>

  <!-- Floating Add Button -->
  <button v-if="currentTab==='contacts'" @click="showAdd=true"
    class="absolute bottom-20 right-4 w-14 h-14 rounded-full bg-pinky/80 text-white text-3xl shadow-soft flex items-center justify-center">＋</button>

  <!-- Add Contact Modal -->
  <div v-if="showAdd" class="absolute inset-0 bg-black/30 flex items-center justify-center">
    <div class="bg-white rounded-2xl p-4 w-11/12 space-y-2 shadow-soft">
      <h3 class="font-semibold">新增聯絡人</h3>
      <input v-model="newContact.name" placeholder="姓名" class="w-full border rounded-lg p-2 text-sm" />
      <input v-model="newContact.role" placeholder="身份" class="w-full border rounded-lg p-2 text-sm" />
      <input v-model="newContact.phone" placeholder="電話" class="w-full border rounded-lg p-2 text-sm" />
      <div class="flex justify-end gap-3 pt-2">
        <button @click="showAdd=false" class="text-sm text-gray-400">取消</button>
        <button @click="addContact(); showAdd=false" class="text-sm text-green-500">新增</button>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <div class="shrink-0 grid grid-cols-5 text-center border-t bg-white text-xs">
    <button class="p-3">⛪ 行程</button>
    <button class="p-3">🪙 金器</button>
    <button class="p-3">🧧 禮物</button>
    <button class="p-3">📝 資訊</button>
    <button class="p-3 text-pink-500 font-semibold">📞 聯絡</button>
  </div>

</div>

<script>
const { createApp } = Vue

createApp({
  data(){
    return {
      currentTab:'contacts',
      contactGroups:['新郎','新娘','其他'],
      activeContactGroup:'新郎',
      contacts: JSON.parse(localStorage.getItem('contacts')||'{"新郎":[],"新娘":[],"其他":[]}'),
      search:'',
      showAdd:false,
      newContact:{ name:'', role:'', phone:'' },
      editIndex:null,
      editContact:{ name:'', role:'', phone:'' }
    }
  },
  computed:{
    filteredContacts(){
      return this.contacts[this.activeContactGroup].filter(c=>
        c.name.includes(this.search) || c.role.includes(this.search) || c.phone.includes(this.search)
      )
    }
  },
  watch:{
    contacts:{ deep:true, handler(v){ localStorage.setItem('contacts',JSON.stringify(v)) } }
  },
  methods:{
    groupBtnClass(g){
      if(this.activeContactGroup!==g) return 'bg-gray-100'
      if(g==='新郎') return 'bg-groom'
      if(g==='新娘') return 'bg-bride'
      return 'bg-other'
    },
    addContact(){
      const { name, role, phone } = this.newContact
      if(!name || !phone) return
      this.contacts[this.activeContactGroup].push({ name, role, phone })
      this.newContact={ name:'', role:'', phone:'' }
    },
    startEdit(c,idx){ this.editIndex=idx; this.editContact={...c} },
    cancelEdit(){ this.editIndex=null },
    saveEdit(idx){ this.contacts[this.activeContactGroup][idx]={...this.editContact}; this.cancelEdit() },
    removeContact(g,idx){ this.contacts[g].splice(idx,1) }
  }
}).mount('#app')
</script>

</body>
</html>
