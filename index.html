<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>婚禮規劃 App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3.4.38/dist/vue.global.prod.js"></script>
  <style>[v-cloak]{display:none}</style>
</head>
<body class="min-h-screen bg-gradient-to-br from-pink-200 via-rose-100 to-purple-200 flex items-center justify-center">

<div id="app" v-cloak class="relative w-full max-w-md h-[92vh] bg-white/80 backdrop-blur rounded-3xl shadow-xl flex flex-col overflow-hidden">

  <!-- Header -->
  <div class="p-4 text-center font-semibold text-lg">{{ pageTitle }}</div>

  <!-- Pages -->
  <div class="flex-1 overflow-y-auto p-4">

    <!-- 當日行程 placeholder -->
    <div v-if="tab==='schedule'" class="text-center text-gray-400">當日行程（下一步）</div>

    <!-- 金器 -->
    <div v-if="tab==='gold'" class="space-y-3">
      <div v-for="g in golds" :key="g.id" class="bg-white rounded-xl p-3 shadow">
        <div class="text-sm font-medium">#{{ g.no }} {{ g.category }} × {{ g.qty }}</div>
        <div class="text-xs" :class="g.side==='男家'?'text-blue-500':'text-pink-500'">{{ g.side }}</div>
        <div class="text-xs text-gray-500">{{ g.from }}</div>
      </div>
      <button @click="showAddGold=true" class="fixed bottom-20 right-6 w-14 h-14 rounded-full bg-pink-400/80 text-white text-3xl flex items-center justify-center shadow-lg">+</button>
    </div>

    <!-- 利是 / 禮物 -->
    <div v-if="tab==='gift'" class="space-y-3">
      <div v-for="i in gifts" :key="i.id" class="bg-white rounded-xl p-3 shadow">
        <div class="text-sm font-medium">#{{ i.no }} {{ i.type }}</div>
        <div v-if="i.type==='禮物'" class="text-xs text-gray-500">{{ i.desc }}</div>
        <div class="text-xs">數量：{{ i.qty }}</div>
        <div class="text-xs" :class="i.side==='男家'?'text-blue-500':'text-pink-500'">{{ i.side }}</div>
        <div class="text-xs">送禮人：{{ i.from }}</div>
        <div class="text-xs font-medium">總金額：$ {{ i.amount }}</div>
      </div>
      <button @click="showAddGift=true" class="fixed bottom-20 right-6 w-14 h-14 rounded-full bg-purple-400/80 text-white text-3xl flex items-center justify-center shadow-lg">+</button>
    </div>

    <!-- 聯絡 -->
    <div v-if="tab==='contact'" class="space-y-3">
      <input v-model="contactSearch" placeholder="搜尋姓名 / 身份" class="w-full rounded-xl border px-3 py-2 text-sm" />
      <div class="flex gap-2 text-xs">
        <button v-for="c in contactCats" :key="c" @click="contactFilter=c" :class="['flex-1 py-1 rounded-xl', contactFilter===c?'bg-pink-400 text-white':'bg-white']">{{ c }}</button>
      </div>
      <div v-for="c in filteredContacts" :key="c.id" class="bg-white rounded-xl p-3 shadow">
        <div class="flex justify-between">
          <div>
            <div class="text-sm font-medium">{{ c.name }}</div>
            <div class="text-xs text-gray-500">{{ c.role }}</div>
            <a :href="'tel:'+c.phone" class="text-xs text-blue-500">{{ c.phone }}</a>
            <div class="text-xs mt-1" :class="c.cat==='新郎'?'text-blue-500':c.cat==='新娘'?'text-pink-500':'text-green-500'">{{ c.cat }}</div>
          </div>
          <div class="flex flex-col gap-1 text-xs">
            <button @click="openEditContact(c)" class="text-blue-500">編輯</button>
            <button @click="deleteContact(c.id)" class="text-red-400">刪除</button>
          </div>
        </div>
      </div>
      <button @click="showAddContact=true" class="fixed bottom-20 right-6 w-14 h-14 rounded-full bg-blue-400/80 text-white text-3xl flex items-center justify-center shadow-lg">+</button>
    </div>

    <!-- 資訊 -->
    <div v-if="tab==='info'" class="text-center text-gray-400">資訊（下一步）</div>

  </div>

  <!-- Bottom Nav -->
  <div class="h-16 border-t bg-white flex justify-around items-center text-xs">
    <button @click="tab='schedule'" :class="navCls('schedule')">⛪<br>當日行程</button>
    <button @click="tab='gold'" :class="navCls('gold')">🪙<br>金器</button>
    <button @click="tab='gift'" :class="navCls('gift')">🧧<br>利是</button>
    <button @click="tab='contact'" :class="navCls('contact')">📞<br>聯絡</button>
    <button @click="tab='info'" :class="navCls('info')">📝<br>資訊</button>
  </div>

</div>

<script>
const { createApp } = Vue
createApp({
  data(){
    return{
      tab:'schedule',
      golds: JSON.parse(localStorage.getItem('goldList')||'[]'),
      gifts: JSON.parse(localStorage.getItem('giftList')||'[]'),
      contacts: JSON.parse(localStorage.getItem('contactList')||'[]'),
      contactCats:['全部','新郎','新娘','其他'],
      contactFilter:'全部',
      contactSearch:'',
      showAddGold:false,
      showAddGift:false,
      showAddContact:false,
      newContact:{ name:'', role:'', phone:'', cat:'其他' },
      editContact:{}
    }
  },
  computed:{
    pageTitle(){
      return this.tab==='schedule'?'⛪ 當日行程':
             this.tab==='gold'?'🪙 金器':
             this.tab==='gift'?'🧧 利是 / 禮物':
             this.tab==='contact'?'📞 聯絡':'📝 資訊'
    },
    filteredContacts(){
      let l=[...this.contacts]
      if(this.contactFilter!=='全部') l=l.filter(c=>c.cat===this.contactFilter)
      if(this.contactSearch){ const s=this.contactSearch.toLowerCase(); l=l.filter(c=>c.name.toLowerCase().includes(s)||c.role.toLowerCase().includes(s)) }
      return l
    }
  },
  methods:{
    navCls(t){
      return ['flex-1 h-full flex flex-col items-center justify-center', this.tab===t?'text-pink-500 font-semibold':'text-gray-400']
    },
    saveContacts(){ localStorage.setItem('contactList', JSON.stringify(this.contacts)) },
    openEditContact(c){ this.editContact={...c}; this.showEditContact=true },
    deleteContact(id){ if(confirm('刪除此聯絡人？')){ this.contacts=this.contacts.filter(x=>x.id!==id); this.saveContacts() } },
    addContact(){ this.contacts.push({ ...this.newContact, id:Date.now() }); this.saveContacts(); this.showAddContact=false; this.newContact={ name:'', role:'', phone:'', cat:'其他' } },
    saveEditContact(){ const i=this.contacts.findIndex(x=>x.id===this.editContact.id); this.contacts[i]={...this.editContact}; this.saveContacts(); this.showEditContact=false }
  }
}).mount('#app')
</script>

</body>
</html>
